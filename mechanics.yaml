# HALYARD / target SABLE — mechanics configuration
#
# Every damage roll, KO range and speed order in Phase 4 inherits these values.
# Pinned once, here, and named in the bundle README so no figure carries an
# unstated assumption.

mechanics_gen: 8          # damage formula and battle mechanics
type_chart_gen: 6         # 18-type chart including Fairy
evs_enabled: true
battle_format: singles

# ---------------------------------------------------------------- provenance
#
# Source: hzla/Dynamic-Calc-Decomps, js/romhack_catalog.js, entry
# "emerald-imperium-1-3". Both published variants hardcode:
#
#     ?data=imp13&dmgGen=8&gen=8&types=6&noSwitch=1&evs=0
#     ?data=imp13&dmgGen=8&gen=8&types=6&noSwitch=1&evs=1
#
# The two differ only in the evs flag, so gen=8 / types=6 is the maintainer's
# configuration for this hack rather than an incidental URL parameter. We take
# the evs=1 branch: source trainer data carries real EV spreads (1,015 slots),
# so modelling them as zero would understate every boss.
#
# ---------------------------------------------------------------- conflict
#
# This CONTRADICTS the hack's own config headers, which resolve
# P_UPDATED_TYPES / B_UPDATED_MOVE_DATA and friends through GEN_LATEST = GEN_9
# (include/config/pokemon.h, include/config/general.h).
#
# Resolution: the calculator's Gen 8 setting wins, for two reasons.
#   1. It is the configuration the community's Imperium calculator actually
#      runs, and its trainer dataset has now been cross-validated against both
#      our source parse (Wattson's Dedenne 30 Spe IV matches exactly) and the
#      compiled locations workbook (30 EV spreads matched, zero contradictions).
#   2. GEN_LATEST is a moving upstream default in pokeemerald-expansion, not a
#      deliberate statement about this hack. We have already seen one dead
#      GEN_LATEST config in this codebase: P_LVL_UP_LEARNSETS reads GEN_LATEST
#      while the entire selection block is disabled by "#if FALSE" at
#      src/pokemon.c:969.
#
# This conflict is a FINDING, not a silent choice. It is recorded in the
# integrity log and must appear in the bundle README.
#
# What actually differs between Gen 8 and Gen 9 for our purposes is small —
# Gen 9's headline change is Terastallization, which this hack does not
# implement — but "small" is not "none", and the assumption is stated so any
# figure derived from it can be re-derived if this pin turns out wrong.
#
# ---------------------------------------------------------------- engine
#
# Damage engine: RadicalRedShowdown/damage-calc via @smogon/calc/adaptable,
# with a custom data layer built from 01_species.tsv and 01b_moves.tsv.
# The fork's bundled Radical Red data layer is never used.
#
# Custom content that must be added to the data layer or flagged:
#   16 abilities — Parasitic Waste, Striker, Bad Company, Ice Eater,
#     Mountaineer, Self Sufficient, Emperor's Presence, Bone Zone, Bull Rush,
#     Quill Rush, Blazing Soul, The Gripper, Fatal Precision, Feline Prowess,
#     Sage Power, Oraoraoraora
#   3 moves — Dark Hole, Aqua Fang, Draco Barrage
# All 19 verified present in source constants.
#
# ---------------------------------------------------------------- versions
#
target_version_played: "1.3.1"
species_move_world_source: "iriv24/pokeemerald-expansion @ 2576d0f (release)"
trainer_source: "hzla/Dynamic-Calc-Decomps backups/imp_1-3.js (Emerald Imperium 1.3)"
#
# Species, move and world data come from the source clone and are validated
# against the 1.3.1 change sheet (10/10 on stats and typings) and the EI dex
# (1,524 matches, zero typing conflicts).
#
# Trainer data does NOT come from that clone: only 8 of 115 boss rosters there
# matched the 1.3 sources. Trainers are Asserted from the 1.3 dataset, with the
# residual 1.3 vs 1.3.1 gap recorded as an open risk.
